name: Release Lifecycle

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Owner-controlled release repository
        required: true
        default: kmccleary3301/t3code
        type: string
      release_tag:
        description: Current stable fork release tag
        required: true
        default: fork-v0.0.47
        type: string
      previous_tag:
        description: Previous stable fork release tag
        required: true
        default: fork-v0.0.46
        type: string

permissions:
  contents: read

jobs:
  posix:
    name: POSIX ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            label: macOS arm64
            runner: macos-26
          - id: macos-x64
            label: macOS x64
            runner: macos-26-intel
          - id: linux-x64
            label: Linux x64
            runner: ubuntu-24.04
          - id: linux-arm64
            label: Linux arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout lifecycle harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Checkout pinned OMP runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: kmccleary3301/oh-my-pi
          ref: c53cd2c2bf521f6eb70cac5484e6474d827498d6
          path: .native/omp

      - name: Build pinned Pi and OMP runtimes
        run: |
          npm install --global bun@1.3.14 @earendil-works/pi-coding-agent@0.84.2
          bun install --cwd .native/omp --frozen-lockfile
          bun --cwd=.native/omp/packages/natives run build
          bun --cwd=.native/omp/packages/coding-agent run build
      - name: Run stock native lifecycle and convergence
        env:
          T3_NATIVE_ROOT_REPORT: ${{ runner.temp }}/stock-native-root-${{ matrix.id }}.json
          T3_NATIVE_MATRIX_REPORT: ${{ runner.temp }}/stock-native-matrix-${{ matrix.id }}.json
          T3_NATIVE_PROVENANCE_REPORT: ${{ runner.temp }}/stock-native-provenance-${{ matrix.id }}.json
          T3_LIFECYCLE_REPOSITORY: ${{ inputs.repository }}
          T3_LIFECYCLE_RELEASE_TAG: ${{ inputs.release_tag }}
          T3_LIFECYCLE_PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          export T3_NATIVE_PI_BINARY="$(command -v pi)"
          export T3_NATIVE_OMP_BINARY="$PWD/.native/omp/packages/coding-agent/dist/omp"
          export T3_NATIVE_PI_PACKAGE_ROOT="$(npm root --global)/@earendil-works/pi-coding-agent"
          export T3_NATIVE_PI_VERSION=0.84.2
          export T3_NATIVE_PI_INTEGRITY="$(npm view @earendil-works/pi-coding-agent@0.84.2 dist.integrity)"
          export T3_NATIVE_OMP_SOURCE_REPOSITORY=kmccleary3301/oh-my-pi
          export T3_NATIVE_OMP_SOURCE_HEAD="$(git -C .native/omp rev-parse HEAD)"
          export T3_NATIVE_OMP_ADDON_DIR="$PWD/.native/omp/packages/natives/native"
          node scripts/native-runtime-provenance.mjs
          vp test run \
            apps/server/src/server.test.ts \
            -t "projects configured (pi|omp) native process through T3 HTTP and WebSocket" \
            --reporter=json \
            --outputFile="$T3_NATIVE_ROOT_REPORT"
          vp test run \
            apps/server/integration/orchestrationEngine.integration.test.ts \
            -t "runs configured (pi|omp) through the native T3 lifecycle matrix|recovers configured (pi|omp) after an isolated stock native process crash" \
            --reporter=json \
            --outputFile="$T3_NATIVE_MATRIX_REPORT"

      - name: Run release lifecycle
        env:
          T3_LIFECYCLE_REPOSITORY: ${{ inputs.repository }}
          T3_LIFECYCLE_RELEASE_TAG: ${{ inputs.release_tag }}
          T3_LIFECYCLE_PREVIOUS_TAG: ${{ inputs.previous_tag }}
          T3_LIFECYCLE_REPORT: ${{ runner.temp }}/release-lifecycle-${{ matrix.id }}.json
          T3_LIFECYCLE_INSTALLED_NATIVE_REPORT: ${{ runner.temp }}/installed-native-${{ matrix.id }}.json
          T3_LIFECYCLE_INSTALLED_NATIVE_TEST_REPORT: ${{ runner.temp }}/installed-native-test-${{ matrix.id }}.json
        run: |
          export T3_LIFECYCLE_NATIVE_ROOT="$HOME"
          export T3_NATIVE_PI_BINARY="$(command -v pi)"
          export T3_NATIVE_OMP_BINARY="$PWD/.native/omp/packages/coding-agent/dist/omp"
          sh scripts/release-lifecycle-posix.sh

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-lifecycle-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/release-lifecycle-${{ matrix.id }}.json
            ${{ runner.temp }}/stock-native-root-${{ matrix.id }}.json
            ${{ runner.temp }}/stock-native-matrix-${{ matrix.id }}.json
            ${{ runner.temp }}/stock-native-provenance-${{ matrix.id }}.json
            ${{ runner.temp }}/installed-native-${{ matrix.id }}.json
            ${{ runner.temp }}/installed-native-test-${{ matrix.id }}.json
          if-no-files-found: ignore
          retention-days: 30

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout lifecycle harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Checkout pinned OMP runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: kmccleary3301/oh-my-pi
          ref: c53cd2c2bf521f6eb70cac5484e6474d827498d6
          path: .native/omp

      - name: Build pinned Pi and OMP runtimes
        run: |
          npm install --global bun@1.3.14 @earendil-works/pi-coding-agent@0.84.2
          bun install --cwd .native/omp --frozen-lockfile
          bun --cwd=.native/omp/packages/natives run build
          bun --cwd=.native/omp/packages/coding-agent run build
      - name: Run stock native lifecycle and convergence
        shell: pwsh
        env:
          T3_NATIVE_ROOT_REPORT: ${{ runner.temp }}/stock-native-root-windows.json
          T3_NATIVE_MATRIX_REPORT: ${{ runner.temp }}/stock-native-matrix-windows.json
          T3_NATIVE_PROVENANCE_REPORT: ${{ runner.temp }}/stock-native-provenance-windows.json
          T3_LIFECYCLE_REPOSITORY: ${{ inputs.repository }}
          T3_LIFECYCLE_RELEASE_TAG: ${{ inputs.release_tag }}
          T3_LIFECYCLE_PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          $env:T3_NATIVE_PI_BINARY = (Get-Command pi.cmd -ErrorAction Stop).Source
          $ompBinary = Join-Path $PWD ".native/omp/packages/coding-agent/dist/omp.exe"
          if (-not (Test-Path $ompBinary)) {
            $ompBinary = Join-Path $PWD ".native/omp/packages/coding-agent/dist/omp"
          }
          $env:T3_NATIVE_OMP_BINARY = (Resolve-Path $ompBinary).Path
          $env:T3_NATIVE_PI_PACKAGE_ROOT = Join-Path (npm root --global) "@earendil-works/pi-coding-agent"
          $env:T3_NATIVE_PI_VERSION = "0.84.2"
          $env:T3_NATIVE_PI_INTEGRITY = (npm view @earendil-works/pi-coding-agent@0.84.2 dist.integrity).Trim()
          $env:T3_NATIVE_OMP_SOURCE_REPOSITORY = "kmccleary3301/oh-my-pi"
          $env:T3_NATIVE_OMP_SOURCE_HEAD = (git -C .native/omp rev-parse HEAD).Trim()
          $env:T3_NATIVE_OMP_ADDON_DIR = (Resolve-Path ".native/omp/packages/natives/native").Path
          node scripts/native-runtime-provenance.mjs
          vp test run `
            apps/server/src/server.test.ts `
            -t "projects configured (pi|omp) native process through T3 HTTP and WebSocket" `
            --reporter=json `
            "--outputFile=$env:T3_NATIVE_ROOT_REPORT"
          vp test run `
            apps/server/integration/orchestrationEngine.integration.test.ts `
            -t "runs configured (pi|omp) through the native T3 lifecycle matrix|recovers configured (pi|omp) after an isolated stock native process crash" `
            --reporter=json `
            "--outputFile=$env:T3_NATIVE_MATRIX_REPORT"

      - name: Run release lifecycle
        shell: pwsh
        env:
          T3_LIFECYCLE_REPOSITORY: ${{ inputs.repository }}
          T3_LIFECYCLE_RELEASE_TAG: ${{ inputs.release_tag }}
          T3_LIFECYCLE_PREVIOUS_TAG: ${{ inputs.previous_tag }}
          T3_LIFECYCLE_REPORT: ${{ runner.temp }}/release-lifecycle-windows.json
          T3_LIFECYCLE_INSTALLED_NATIVE_REPORT: ${{ runner.temp }}/installed-native-windows.json
          T3_LIFECYCLE_INSTALLED_NATIVE_TEST_REPORT: ${{ runner.temp }}/installed-native-test-windows.json
        run: |
          $env:T3_LIFECYCLE_NATIVE_ROOT = Join-Path $env:RUNNER_TEMP "t3-pi-omp-native-state-windows"
          $env:T3_NATIVE_PI_BINARY = (Get-Command pi.cmd -ErrorAction Stop).Source
          $ompBinary = Join-Path $PWD ".native/omp/packages/coding-agent/dist/omp.exe"
          if (-not (Test-Path $ompBinary)) {
            $ompBinary = Join-Path $PWD ".native/omp/packages/coding-agent/dist/omp"
          }
          $env:T3_NATIVE_OMP_BINARY = (Resolve-Path $ompBinary).Path
          ./scripts/release-lifecycle-windows.ps1

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-lifecycle-windows
          path: |
            ${{ runner.temp }}/release-lifecycle-windows.json
            ${{ runner.temp }}/stock-native-root-windows.json
            ${{ runner.temp }}/stock-native-matrix-windows.json
            ${{ runner.temp }}/stock-native-provenance-windows.json
            ${{ runner.temp }}/installed-native-windows.json
            ${{ runner.temp }}/installed-native-test-windows.json
          if-no-files-found: ignore
          retention-days: 30
