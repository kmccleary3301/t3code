name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Installer focused tests
        run: vp test run scripts/install.test.ts

      - name: Product identity contract tests
        run: vp test run packages/contracts/src/productIdentity.test.ts

      - name: Check TypeScript relative-import policy
        run: vp run check:ts-relative-imports
      - name: Check workflow action pins and trusted publishers
        run: vp run check:workflow-action-pins

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
          T3CODE_TRANSFER_BUDGET_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: vp run test
      - name: Pi and OMP protocol fixture tests
        run: >-
          vp test run
          apps/server/src/provider/piFamily/ProtocolContract.test.ts
          apps/server/src/provider/piFamily/NativeAdapter.test.ts
          apps/server/src/provider/piFamily/OmpChunkAssembler.test.ts
          apps/server/src/provider/piFamily/StrictJsonlDecoder.test.ts

      - name: Publish transfer budget report
        if: always()
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thread-transfer-results-v2
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  focused_pi_omp_gate:
    name: Pi OMP Focused Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - id: classify
        name: Classify changes
        env:
          T3_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          T3_CHANGE_HEAD: ${{ github.sha }}
        run: vp run classify-ci-change

      - name: Checkout pinned OMP runtime
        if: steps.classify.outputs.replay_gate == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: kmccleary3301/oh-my-pi
          ref: c53cd2c2bf521f6eb70cac5484e6474d827498d6
          path: .native/omp

      - name: Build pinned Pi and OMP runtimes
        if: steps.classify.outputs.replay_gate == 'true'
        run: |
          npm install --global bun@1.3.14 @earendil-works/pi-coding-agent@0.84.2
          bun install --cwd .native/omp --frozen-lockfile
          bun --cwd=.native/omp/packages/natives run build
          bun --cwd=.native/omp/packages/coding-agent run build

      - name: Run credential-free stock native matrix
        if: steps.classify.outputs.replay_gate == 'true'
        env:
          T3_NATIVE_ROOT_REPORT: ${{ runner.temp }}/stock-native-root-ci.raw.json
          T3_NATIVE_MATRIX_REPORT: ${{ runner.temp }}/stock-native-matrix-ci.raw.json
          T3_NATIVE_PROVENANCE_REPORT: ${{ runner.temp }}/stock-native-provenance-ci.json
          T3_EVIDENCE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export T3_NATIVE_PI_BINARY="$(command -v pi)"
          export T3_NATIVE_OMP_BINARY="$PWD/.native/omp/packages/coding-agent/dist/omp"
          export T3_NATIVE_PI_PACKAGE_ROOT="$(npm root --global)/@earendil-works/pi-coding-agent"
          export T3_NATIVE_PI_VERSION=0.84.2
          export T3_NATIVE_PI_INTEGRITY="$(npm view @earendil-works/pi-coding-agent@0.84.2 dist.integrity)"
          export T3_NATIVE_OMP_SOURCE_REPOSITORY=kmccleary3301/oh-my-pi
          export T3_NATIVE_OMP_SOURCE_HEAD="$(git -C .native/omp rev-parse HEAD)"
          export T3_NATIVE_OMP_ADDON_DIR="$PWD/.native/omp/packages/natives/native"
          node scripts/native-runtime-provenance.mjs
          vp test run \
            apps/server/src/server.test.ts \
            -t "projects configured (pi|omp) native process through T3 HTTP and WebSocket|matches configured (pi|omp) live and exact replay through T3 HTTP and WebSocket" \
            --reporter=json \
            --outputFile="$T3_NATIVE_ROOT_REPORT"
          vp test run \
            apps/server/integration/orchestrationEngine.integration.test.ts \
            -t "runs configured (pi|omp) through the native T3 lifecycle matrix|recovers configured (pi|omp) after an isolated stock native process crash" \
            --reporter=json \
            --outputFile="$T3_NATIVE_MATRIX_REPORT"

      - name: Encrypt native failure diagnostics
        if: failure() && steps.classify.outputs.replay_gate == 'true'
        env:
          T3_DIAGNOSTIC_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA1QsM0Z5y8AeekVpBQAQs
            htw22RR8aEKArkJvrIDgJZyews8wOadpydUmY1S6gQ9T/+uelmT28emCvLzYrETd
            rS78EsxalD+1KBQQrsvykuX2aF8x893y21/OhtZnr/LuS/E5GXFDcWR4j9649w7e
            +m22NAGkR+hQI9aYnxpDOkA2D9rhYc0ya9j7Mq30TbDznfOLRotrqU8Q6dLROdzg
            uPXsgNZPVZAM/eUIBeXEvTpDrS7UIo24QT+lb+NBrZF9cgxzQfjqbyy+O/EmoU9n
            f4N8RHqLEDDI7eF/hFF4aiBTVbpm8SPfZWYiY1Wn6TFfCWWgQ1BqYVtB+LUEq8Ed
            F53ufLQQ9bkcW8K1/ljqR6wfdc38Go1fUyxkqBsYWiIx96tcu28w2NciPpy408GO
            rS25e7K5KjivG+i9b1Qbirfxzgr1kuL2fzkX4IPNUtpzNxHlteS10lhtZQuZP+bX
            H/gws/LBppsPwR/tMmoCNp7vHAqLC4vybD8AOQOHV71I1yeSqbg83skxIvdGMHL9
            KqBdOooSlirU3MKrRjf5C27RrW688gv5lMB8W3JzPnEN7JeQCO/TUewa5UFucKlS
            eUkhHpSk4tKCdp/2KcLCHKlMDIi7eZpphAdOnAq9DmNnP7VND6ckRZU/nw6kdEFc
            lZUkSoZAa9WZE+UB1OPr2ikCAwEAAQ==
            -----END PUBLIC KEY-----
        run: |
          set -euo pipefail
          public_key="$RUNNER_TEMP/native-diagnostic-public.pem"
          printf '%s\n' "$T3_DIAGNOSTIC_PUBLIC_KEY" > "$public_key"
          for report in "$RUNNER_TEMP"/stock-native-*-ci.raw.json; do
            if [[ -f "$report" ]]; then
              openssl cms -encrypt -binary -aes-256-cbc -outform DER \
                -in "$report" \
                -out "$report.cms" \
                -recip "$public_key"
            fi
          done
          rm -f "$public_key"

      - name: Sanitize native test evidence
        if: always() && steps.classify.outputs.replay_gate == 'true'
        env:
          T3_EVIDENCE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sanitize() {
            local input="$1"
            local output="$2"
            local kind="$3"
            if [[ -f "$input" ]]; then
              node apps/server/scripts/sanitize-vitest-evidence.mjs \
                "$input" "$output" "$kind" "$T3_EVIDENCE_SOURCE_HEAD"
            fi
          }
          sanitize \
            "$RUNNER_TEMP/stock-native-root-ci.raw.json" \
            "$RUNNER_TEMP/stock-native-root-ci.json" \
            stock-native-root
          sanitize \
            "$RUNNER_TEMP/stock-native-matrix-ci.raw.json" \
            "$RUNNER_TEMP/stock-native-matrix-ci.json" \
            stock-native-matrix

      - name: Replay scrubbed Pi and OMP traces
        if: steps.classify.outputs.replay_gate == 'true'
        run: >-
          vp test run
          apps/server/src/provider/piFamily/NativeTraceCorpus.test.ts
          apps/server/src/provider/piFamily/NativeTraceReplay.test.ts

      - name: Run native replay through T3 HTTP and WebSocket
        if: steps.classify.outputs.replay_gate == 'true'
        run: >-
          vp test run apps/server/src/server.test.ts
          -t "projects scrubbed .* native replay"
      - name: Run credential-free native process smoke
        if: steps.classify.outputs.replay_gate == 'true'
        run: >-
          vp test run apps/server/src/provider/piFamily/NativeAdapter.test.ts
          -t "starts pi, negotiates capabilities, and completes a prompt|starts omp, negotiates capabilities, and completes a prompt"

      - name: Run transfer and convergence gates
        if: steps.classify.outputs.budget_gate == 'true'
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
          T3CODE_TRANSFER_BUDGET_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          vp test run
          apps/server/integration/TransferBudgetReport.integration.test.ts
          apps/server/src/server.test.ts
          -t "reports thread HTTP and WebSocket transfer budgets|keeps authenticated .* thread subscribers converged across bounded reconnect replay"

      - name: Measure deterministic performance baseline
        if: steps.classify.outputs.replay_gate == 'true'
        env:
          T3_EVIDENCE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          T3_PERFORMANCE_REPORT_PATH: ${{ runner.temp }}/pi-omp-performance.json
        run: node apps/server/scripts/performance-baseline.ts

      - name: Upload focused aggregate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-omp-focused-evidence
          path: |
            ${{ runner.temp }}/t3code-transfer-budget.md
            ${{ runner.temp }}/thread-transfer-result.json
            ${{ runner.temp }}/pi-omp-performance.json
            ${{ runner.temp }}/stock-native-root-ci.json
            ${{ runner.temp }}/stock-native-matrix-ci.json
            ${{ runner.temp }}/stock-native-provenance-ci.json
            ${{ runner.temp }}/stock-native-*-ci.raw.json.cms
          if-no-files-found: ignore
          retention-days: 30

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: vp run release:smoke

      - name: Release security invariants
        run: node scripts/release-security-check.ts
