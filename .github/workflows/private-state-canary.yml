name: Private state canary

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-state-canary:
    name: Private state canary
    runs-on: [self-hosted, private-state, linux]
    timeout-minutes: 15
    env:
      T3_PRIVATE_STATE_DB: ${{ vars.T3_PRIVATE_STATE_DB }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Require private source configuration
        run: |
          test -n "$T3_PRIVATE_STATE_DB"
          test -f "$T3_PRIVATE_STATE_DB"
          test ! -e "$(dirname "$T3_PRIVATE_STATE_DB")/server-runtime.json"

      - name: Run migration and reprojection canary
        run: |
          output_dir="$(mktemp -d "${RUNNER_TEMP}/t3-private-canary.XXXXXX")"
          chmod 700 "$output_dir"
          trap 'rm -rf "$output_dir"' EXIT
          vp run private-state-canary --source "$T3_PRIVATE_STATE_DB" --output-dir "$output_dir"
          test "$(stat -c '%a' "$output_dir")" = 700
          test "$(stat -c '%a' "$output_dir/REPORT.json")" = 600
          test "$(find "$output_dir" -mindepth 1 -maxdepth 1 -type f ! -name REPORT.json | wc -l)" -eq 0

      - name: Exercise rollback injection without publishing private state
        run: |
          output_dir="$(mktemp -d "${RUNNER_TEMP}/t3-private-canary-failure.XXXXXX")"
          chmod 700 "$output_dir"
          trap 'rm -rf "$output_dir"' EXIT
          set +e
          vp run private-state-canary --source "$T3_PRIVATE_STATE_DB" --output-dir "$output_dir" --inject migration
          status=$?
          set -e
          test "$status" -ne 0
          test "$(node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1])); process.stdout.write(r.status)" "$output_dir/REPORT.json")" = failed
          test "$(stat -c '%a' "$output_dir/REPORT.json")" = 600
          test "$(find "$output_dir" -mindepth 1 -maxdepth 1 -type f ! -name REPORT.json | wc -l)" -eq 0
