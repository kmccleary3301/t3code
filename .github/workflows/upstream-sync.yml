name: Upstream Sync

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check upstream ancestry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      T3CODE_UPSTREAM_REPOSITORY: ${{ vars.T3CODE_UPSTREAM_REPOSITORY || 'pingdotgg/t3code' }}
    steps:
      - name: Checkout fork history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Fetch upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${T3CODE_UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

      - name: Verify fork contains upstream
        run: node scripts/check-upstream-sync.ts --remote upstream --ref main
