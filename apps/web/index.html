<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#0a0a0a";
        // Update every theme-color meta so any element another layer added
        // carries the resolved color too.
        const setThemeColor = (color) => {
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
            meta.setAttribute("content", color);
          }
        };

        const isRecord = (value) =>
          typeof value === "object" && value !== null && !Array.isArray(value);

        const applySafeAppearance = () => {
          const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          delete document.documentElement.dataset.themeId;
          delete document.documentElement.dataset.t3AppearanceActive;
          document.documentElement.dataset.appearanceSafeMode = "true";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          setThemeColor(dark ? DARK_BACKGROUND : LIGHT_BACKGROUND);
        };

        try {
          const appearanceRecovery = new URLSearchParams(window.location?.search ?? "").get(
            "t3-appearance",
          );
          if (appearanceRecovery === "safe" || appearanceRecovery === "reset") {
            applySafeAppearance();
            return;
          }
          const decodeAppearanceBoot = () => {
            const raw = window.localStorage.getItem("t3code:appearance:boot:v1");
            if (raw === null) return null;
            const bytes = Array.from(raw).reduce(
              (total, character) =>
                total +
                (character.codePointAt(0) <= 0x7f
                  ? 1
                  : character.codePointAt(0) <= 0x7ff
                    ? 2
                    : character.codePointAt(0) <= 0xffff
                      ? 3
                      : 4),
              0,
            );
            if (bytes > 8 * 1024) return null;
            const value = JSON.parse(raw);
            if (
              !isRecord(value) ||
              value.version !== 2 ||
              !Number.isSafeInteger(value.revision) ||
              value.revision < 0 ||
              typeof value.themeId !== "string" ||
              value.themeId.length === 0 ||
              value.themeId.length > 128 ||
              (value.mode !== "light" && value.mode !== "dark" && value.mode !== "system") ||
              (value.systemAppearance !== undefined &&
                (value.mode !== "system" ||
                  (value.systemAppearance !== "light" && value.systemAppearance !== "dark"))) ||
              typeof value.safeMode !== "boolean" ||
              !isRecord(value.colorVariables) ||
              typeof value.checksum !== "string" ||
              !/^[0-9a-f]{8}$/.test(value.checksum)
            ) {
              return null;
            }
            const entries = Object.entries(value.colorVariables);
            if (
              entries.length > 128 ||
              entries.some(
                ([name, color]) =>
                  !/^--(?:t3|app-theme)-[a-z0-9-]{1,96}$/.test(name) ||
                  typeof color !== "string" ||
                  color.length === 0 ||
                  color.length > 256 ||
                  /[{};]|url\s*\(|javascript\s*:/i.test(color),
              )
            ) {
              return null;
            }
            const colorVariables = Object.fromEntries(
              entries.sort(([left], [right]) => (left < right ? -1 : left > right ? 1 : 0)),
            );
            const body = {
              version: 2,
              revision: value.revision,
              themeId: value.themeId,
              mode: value.mode,
              ...(value.systemAppearance === undefined
                ? {}
                : { systemAppearance: value.systemAppearance }),
              safeMode: value.safeMode,
              colorVariables,
            };
            const encoded = JSON.stringify(body);
            let hash = 0x811c9dc5;
            for (let index = 0; index < encoded.length; index += 1) {
              hash ^= encoded.charCodeAt(index);
              hash = Math.imul(hash, 0x01000193);
            }
            return (hash >>> 0).toString(16).padStart(8, "0") === value.checksum ? body : null;
          };
          const appearanceBoot = decodeAppearanceBoot();
          if (appearanceBoot !== null) {
            const bootMode =
              appearanceBoot.mode === "system"
                ? window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light"
                : appearanceBoot.mode;
            const paletteMatchesSystem =
              appearanceBoot.systemAppearance === undefined ||
              appearanceBoot.systemAppearance === bootMode;
            const bootVariables = paletteMatchesSystem ? appearanceBoot.colorVariables : {};
            for (const [name, color] of Object.entries(bootVariables)) {
              document.documentElement.style.setProperty(name, color);
              if (name === "--app-theme-canvas")
                document.documentElement.style.setProperty("--boot-background", color);
              if (name === "--app-theme-text")
                document.documentElement.style.setProperty("--boot-foreground", color);
              if (name === "--app-theme-accent")
                document.documentElement.style.setProperty("--boot-accent", color);
            }
            if (paletteMatchesSystem) document.documentElement.dataset.themeSelected = "true";
            else delete document.documentElement.dataset.themeSelected;
            if (appearanceBoot.safeMode) {
              document.documentElement.dataset.appearanceSafeMode = "true";
              delete document.documentElement.dataset.themeId;
              delete document.documentElement.dataset.t3AppearanceActive;
            } else {
              delete document.documentElement.dataset.appearanceSafeMode;
              if (paletteMatchesSystem)
                document.documentElement.dataset.t3AppearanceActive = "true";
              else delete document.documentElement.dataset.t3AppearanceActive;
              if (!paletteMatchesSystem || appearanceBoot.themeId === "builtin") {
                delete document.documentElement.dataset.themeId;
              } else {
                document.documentElement.dataset.themeId = appearanceBoot.themeId;
              }
            }
            document.documentElement.classList.toggle("dark", bootMode === "dark");
            document.documentElement.style.colorScheme = bootMode;
            const background =
              bootVariables["--app-theme-canvas"] ??
              (bootMode === "dark" ? DARK_BACKGROUND : LIGHT_BACKGROUND);
            document.documentElement.style.backgroundColor = background;
            setThemeColor(background);
            return;
          }
          // IndexedDB is authoritative after migration, but it cannot be read
          // synchronously here. Without a valid checksummed boot snapshot,
          // paint only the built-in neutral surface; the runtime will migrate
          // legacy preferences or recover durable safe mode before activation.
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          delete document.documentElement.dataset.themeId;
          delete document.documentElement.dataset.t3AppearanceActive;
          delete document.documentElement.dataset.themeSelected;
          document.documentElement.classList.toggle("dark", prefersDark);
          document.documentElement.style.colorScheme = prefersDark ? "dark" : "light";
          const fallbackColor = prefersDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = fallbackColor;
          setThemeColor(fallbackColor);
        } catch {
          // Mirror the runtime's storage-failure fallback: follow the OS.
          let prefersDark = true;
          try {
            prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {
            // Keep the dark default when even matchMedia is unavailable.
          }
          delete document.documentElement.dataset.themeId;
          delete document.documentElement.dataset.t3AppearanceActive;
          delete document.documentElement.dataset.themeSelected;
          document.documentElement.classList.toggle("dark", prefersDark);
          const fallbackColor = prefersDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = fallbackColor;
          setThemeColor(fallbackColor);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      html.dark body {
        background: #0a0a0a;
        color: #f5f5f5;
      }

      #boot-shell {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
        color: inherit;
      }

      html[data-theme-selected="true"] #boot-shell {
        background: var(--boot-background);
        color: var(--boot-foreground);
      }

      #boot-shell-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <title>T3 Code (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="T3 Code splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="T3 Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
